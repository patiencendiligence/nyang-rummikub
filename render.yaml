services:
  - type: web
    name: nyang-rummikub
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/records
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_SOCKET_URL
        value: https://nyang-rummikub.onrender.com