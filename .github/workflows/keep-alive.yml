name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          curl -sf -o /dev/null -w "status: %{http_code}\n" \
            https://nyang-rummikub.onrender.com/api/records || \
          echo "ping failed (server may be waking up, that's expected sometimes)"